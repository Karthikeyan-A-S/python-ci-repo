name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run tests and generate report
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --junitxml=test-report.xml

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-report.xml

  promote-to-release:
    name: Promote to Release Branch
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push to release
        run: git push origin HEAD:refs/heads/release

  promote-to-prod:
    name: Promote to Prod Branch
    needs: promote-to-release
    runs-on: ubuntu-latest
    environment: 
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push to prod
        run: git push origin HEAD:refs/heads/prod
